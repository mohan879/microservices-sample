name: Java DevSecOps Pipeline (No Sonar)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:

# ----------------------------------------
# 1. BUILD + UNIT TEST + COVERAGE
# ----------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
  
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven
  

      - name: Build & Run Tests
        run: mvn clean test || true
      
      - name: Debug (check reports)
        run: |
          echo "Listing generated reports..."
          find . -name "*.xml"
      
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: '**/surefire-reports/*.xml'
          reporter: java-junit


# ----------------------------------------
# 2. CODE QUALITY (SONAR ALTERNATIVE)
# ----------------------------------------
  code-quality:
    name: Code Quality (Checkstyle + PMD + SpotBugs)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Code Quality Checks
        run: |
          mvn checkstyle:checkstyle
          mvn pmd:pmd
          mvn spotbugs:spotbugs || true
      
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            target/site/checkstyle.html
            target/site/pmd.html
            target/spotbugsXml.xml


# ----------------------------------------
# 3. SECURITY TESTING
# ----------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
  
    permissions:
      contents: read
      security-events: write
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
  
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
  
      - name: Build Project
        run: mvn compile
  
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
